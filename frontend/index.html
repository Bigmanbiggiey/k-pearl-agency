<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/branding/k-pearl-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111114" />
    <!--
      No static <title> or <meta name="description"> here on purpose. Every
      route renders <Seo> (src/components/Seo.tsx) and React 19 hoists those
      into <head>. React only de-dupes among the tags it renders — a static
      tag here would survive alongside React's, leaving two <title> / two
      description tags on every page. See docs/launch-audit.md §SEO.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
