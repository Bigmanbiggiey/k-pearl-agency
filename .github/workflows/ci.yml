name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

      # Local Supabase stack (docs/testing.md — integration + E2E need the
      # real thing, not mocks). `supabase/config.toml` pins every port to the
      # 553xx range and seeds dev staff + sample properties on reset.
      - name: Start local Supabase
        working-directory: .
        run: npx supabase@2.116.0 start
      - name: Reset database (migrations + dev seed)
        working-directory: .
        run: npx supabase@2.116.0 db reset

      - name: Write local Supabase env
        run: |
          echo "VITE_SUPABASE_URL=http://127.0.0.1:55321" > .env
          echo "VITE_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0" >> .env

      - run: npm run test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - name: Stop local Supabase
        if: always()
        working-directory: .
        run: npx supabase@2.116.0 stop

      - run: npm run build
